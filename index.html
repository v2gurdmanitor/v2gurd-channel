<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V2GURD Channel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#0b1218;
    --header:#111b23;
    --card:#17232d;
    --card2:#1a2933;
    --green:#39ff88;
    --blue:#168fff;
    --red:#ff4969;
    --text:#f1f7f5;
    --muted:#8da09a;
    --line:rgba(255,255,255,.07);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(57,255,136,.035),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(22,143,255,.035),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
}


/* ================================
   MAIN APP
================================ */

.app{
    width:min(760px,100%);
    min-height:100vh;
    margin:auto;
    background:rgba(8,15,21,.55);
}


/* ================================
   HEADER
================================ */

.header{
    position:sticky;
    top:0;
    z-index:50;

    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(17,27,35,.94);

    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--line);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #14251d,
            #102d22
        );

    border:1px solid rgba(57,255,136,.2);

    color:var(--green);

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 0 20px rgba(57,255,136,.08);
}

.channel-name{
    font-size:14px;
    font-weight:800;

    display:flex;
    align-items:center;
    gap:5px;
}

.verify{
    width:17px;
    height:17px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#168fff;

    color:white;

    font-size:9px;

    box-shadow:
        0 0 10px rgba(22,143,255,.4);
}

.channel-status{
    margin-top:2px;

    color:var(--muted);

    font-size:9px;
}

.online{
    color:var(--green);
}


/* ================================
   MENU
================================ */

.menu{
    width:35px;
    height:35px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#9cafaa;

    font-size:19px;
}


/* ================================
   CHANNEL COVER
================================ */

.cover{
    padding:28px 18px 20px;

    background:
        linear-gradient(
            180deg,
            rgba(22,143,255,.035),
            transparent
        );

    border-bottom:1px solid var(--line);
}

.cover-title{
    font-size:20px;
    font-weight:800;

    margin-bottom:6px;
}

.cover-description{
    color:var(--muted);

    font-size:10px;

    line-height:2;

    max-width:600px;
}

.cover-line{
    width:50px;
    height:2px;

    margin-top:14px;

    background:var(--green);

    box-shadow:
        0 0 10px rgba(57,255,136,.35);
}


/* ================================
   POSTS
================================ */

.feed{
    padding:14px 10px 50px;
}

.post{
    position:relative;

    margin-bottom:10px;

    padding:16px 16px 12px;

    background:
        linear-gradient(
            145deg,
            rgba(27,40,49,.98),
            rgba(20,32,41,.98)
        );

    border:1px solid rgba(255,255,255,.055);

    border-radius:15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.12);

    animation:
        postIn .35s ease both;
}

@keyframes postIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.post:hover{
    border-color:
        rgba(57,255,136,.12);
}

.post.important{
    border-right:
        2px solid var(--red);
}

.post.update{
    border-right:
        2px solid var(--blue);
}

.post.success{
    border-right:
        2px solid var(--green);
}


/* POST HEADER */

.post-header{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:10px;
}

.post-icon{
    width:30px;
    height:30px;

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.045);

    font-size:14px;
}

.post-meta{
    flex:1;
}

.post-title{
    font-size:12px;
    font-weight:800;
}

.post-type{
    margin-top:2px;

    font-size:8px;

    color:var(--muted);
}


/* POST CONTENT */

.post-content{
    color:#d9e5e1;

    font-size:11px;

    line-height:2.05;

    white-space:pre-wrap;

    word-break:break-word;
}


/* POST FOOTER */

.post-footer{
    display:flex;
    justify-content:flex-end;
    align-items:center;

    gap:6px;

    margin-top:11px;

    padding-top:9px;

    border-top:1px solid rgba(255,255,255,.035);

    color:#667a73;

    font-size:8px;
}

.check{
    color:#42a5ff;
    font-size:10px;
}


/* ================================
   LOADING
================================ */

.loading{
    text-align:center;

    padding:55px 20px;

    color:var(--muted);

    font-size:10px;
}

.loader{
    width:25px;
    height:25px;

    margin:0 auto 12px;

    border-radius:50%;

    border:
        2px solid
        rgba(57,255,136,.12);

    border-top-color:
        var(--green);

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ================================
   EMPTY
================================ */

.empty{
    text-align:center;

    padding:65px 20px;

    color:var(--muted);

    font-size:10px;
}

.empty-icon{
    font-size:30px;

    margin-bottom:12px;

    opacity:.7;
}


/* ================================
   ERROR
================================ */

.error{
    margin:20px;

    padding:15px;

    border-radius:12px;

    color:#ff9aac;

    background:
        rgba(255,73,105,.07);

    border:
        1px solid
        rgba(255,73,105,.15);

    font-size:9px;

    line-height:1.8;
}


/* ================================
   FOOTER
================================ */

.footer{
    text-align:center;

    padding:20px;

    color:#52645e;

    font-size:8px;

    border-top:1px solid var(--line);
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .header{
        height:68px;
        padding:0 14px;
    }

    .avatar{
        width:41px;
        height:41px;
    }

    .channel-name{
        font-size:13px;
    }

    .cover{
        padding:22px 15px 17px;
    }

    .cover-title{
        font-size:18px;
    }

    .feed{
        padding:
            10px 7px 40px;
    }

    .post{
        padding:
            14px 13px 11px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- ================================
     HEADER
================================ -->

<header class="header">

    <div class="header-left">

        <div class="avatar">
            V
        </div>

        <div>

            <div class="channel-name">

                V2GURD

                <span class="verify">
                    ✓
                </span>

            </div>

            <div class="channel-status">

                کانال رسمی
                <span class="online">
                    • آنلاین
                </span>

            </div>

        </div>

    </div>


    <div class="menu">
        ⋮
    </div>

</header>


<!-- ================================
     COVER
================================ -->

<section class="cover">

    <div class="cover-title">
        V2GURD Channel
    </div>

    <div class="cover-description">
        مرجع اطلاع‌رسانی رسمی V2GURD
        <br>
        اطلاعیه‌ها، بروزرسانی‌ها و وضعیت سرویس‌ها
    </div>

    <div class="cover-line"></div>

</section>


<!-- ================================
     FEED
================================ -->

<main id="feed" class="feed">

    <div class="loading">

        <div class="loader"></div>

        در حال دریافت اطلاعیه‌ها...

    </div>

</main>


<footer class="footer">

    V2GURD
    <span style="color:#168fff;">✓</span>

    • Official Channel

</footer>


</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://dymfrorzgmmsbvazsvnb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UXgv11NDv5gIxPdKwMZwZQ_WSQZa2qw";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   FEED
================================= */

const feed =
document.getElementById("feed");


/* =================================
   TYPE SETTINGS
================================= */

function getPostType(type){

    switch(type){

        case "important":

            return {
                icon:"🚨",
                label:"اطلاعیه مهم",
                className:"important"
            };

        case "update":

            return {
                icon:"🛠️",
                label:"بروزرسانی",
                className:"update"
            };

        case "success":

            return {
                icon:"🟢",
                label:"وضعیت پایدار",
                className:"success"
            };

        default:

            return {
                icon:"📢",
                label:"اطلاعیه",
                className:"normal"
            };

    }

}


/* =================================
   DATE
================================= */

function formatDate(date){

    const d =
        new Date(date);

    return new Intl.DateTimeFormat(
        "fa-IR",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    ).format(d);

}


/* =================================
   TIME
================================= */

function formatTime(date){

    const d =
        new Date(date);

    return new Intl.DateTimeFormat(
        "fa-IR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(d);

}


/* =================================
   LOAD POSTS
================================= */

async function loadPosts(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("posts")

        .select(
            "id,title,content,type,created_at,published"
        )

        .eq(
            "published",
            true
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            console.error(
                "LOAD POSTS ERROR:",
                error
            );

            showError(
                error.message
            );

            return;
        }


        renderPosts(
            data || []
        );


    }catch(error){

        console.error(error);

        showError(
            error.message
        );

    }

}


/* =================================
   RENDER
================================= */

function renderPosts(posts){

    if(!posts.length){

        feed.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                هنوز اطلاعیه‌ای منتشر نشده است.

            </div>

        `;

        return;
    }


    feed.innerHTML = "";


    posts.forEach(
        (post,index) => {

            const info =
                getPostType(
                    post.type
                );


            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "post " +
                info.className;


            article.style.animationDelay =
                (index * .04) + "s";


            article.innerHTML = `

                <div class="post-header">

                    <div class="post-icon">
                        ${info.icon}
                    </div>

                    <div class="post-meta">

                        <div class="post-title">
                            ${escapeHTML(post.title)}
                        </div>

                        <div class="post-type">
                            ${info.label}
                        </div>

                    </div>

                </div>


                <div class="post-content">
                    ${escapeHTML(post.content)}
                </div>


                <div class="post-footer">

                    <span>
                        ${formatDate(post.created_at)}
                    </span>

                    <span>
                        ${formatTime(post.created_at)}
                    </span>

                    <span class="check">
                        ✓✓
                    </span>

                </div>

            `;


            feed.appendChild(
                article
            );

        }
    );

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================
   ERROR
================================= */

function showError(message){

    feed.innerHTML = `

        <div class="error">

            ❌ دریافت اطلاعیه‌ها انجام نشد.

            <br><br>

            ${escapeHTML(message)}

        </div>

    `;

}


/* =================================
   REALTIME
================================= */

supabaseClient

.channel(
    "v2gurd-posts"
)

.on(

    "postgres_changes",

    {
        event:"*",
        schema:"public",
        table:"posts"
    },

    payload => {

        console.log(
            "Realtime update:",
            payload
        );

        loadPosts();

    }

)

.subscribe();


/* =================================
   INITIAL LOAD
================================= */

loadPosts();

</script>

</body>
</html>
