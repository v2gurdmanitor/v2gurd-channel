
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V2GURD Admin</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --green:#39ff88;
    --blue:#2196ff;
    --red:#ff4164;
    --bg:#020608;
    --card:rgba(7,18,23,.78);
    --border:rgba(57,255,136,.14);
    --text:#effff6;
    --muted:#71877e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#020608;
    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        linear-gradient(rgba(57,255,136,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(33,150,255,.025) 1px,transparent 1px);

    background-size:45px 45px;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.12;
    z-index:-4;
}

.green{
    background:var(--green);
    top:-180px;
    right:-150px;
}

.blue{
    background:var(--blue);
    bottom:-180px;
    left:-150px;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:10;

    background:rgba(2,7,9,.78);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(25px);
}

.header{
    width:min(850px,calc(100% - 24px));
    margin:auto;

    padding:16px 0;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.verify{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:19px;
    height:19px;

    border-radius:50%;

    background:#168fff;
    color:white;

    font-size:11px;

    box-shadow:0 0 15px rgba(22,143,255,.6);
}

.admin-label{
    color:var(--green);
    font-size:9px;
    letter-spacing:2px;
}


/* MAIN */

main{
    width:min(850px,calc(100% - 24px));
    margin:auto;

    padding:35px 0 70px;
}

.title{
    margin-bottom:22px;
}

.title small{
    color:var(--green);
    font-size:9px;
    letter-spacing:3px;
}

.title h1{
    margin-top:7px;
    font-size:28px;
}

.title p{
    color:var(--muted);
    font-size:10px;
    margin-top:6px;
}


/* CARD */

.card{
    padding:22px;
    border-radius:22px;

    background:var(--card);

    border:1px solid var(--border);

    backdrop-filter:blur(20px);

    margin-bottom:16px;
}

.card-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:17px;
}


/* INPUT */

label{
    display:block;

    color:#71877e;

    font-size:9px;

    margin-bottom:7px;
}

input,
textarea,
select{

    width:100%;

    border:none;
    outline:none;

    color:white;

    font-family:inherit;
    font-size:11px;

    background:rgba(0,0,0,.28);

    border:1px solid rgba(255,255,255,.06);

    border-radius:13px;

    padding:13px;

    margin-bottom:15px;

    transition:.25s;
}

textarea{
    min-height:150px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{

    border-color:rgba(57,255,136,.35);

    box-shadow:
        0 0 20px rgba(57,255,136,.05);
}


/* BUTTON */

button{

    width:100%;

    border:none;

    cursor:pointer;

    font-family:inherit;

    color:#001108;

    background:var(--green);

    padding:13px;

    border-radius:13px;

    font-size:11px;

    font-weight:800;

    transition:.25s;
}

button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(57,255,136,.2);
}


/* PREVIEW */

.preview{

    border:1px solid rgba(255,255,255,.05);

    border-radius:18px;

    padding:17px;

    background:rgba(0,0,0,.18);
}

.preview-header{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:12px;
}

.preview-avatar{

    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(57,255,136,.08);

}

.preview-name{
    font-size:10px;
    font-weight:700;
}

.preview-date{
    color:#50615b;
    font-size:8px;
}

.preview-title{
    color:var(--green);
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

.preview-text{
    color:#b4c5be;
    font-size:10px;
    line-height:2;
    white-space:pre-line;
}


/* STATUS */

.status{

    display:flex;
    align-items:center;
    gap:7px;

    color:var(--green);

    font-size:9px;

    margin-top:13px;
}

.dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 12px var(--green);
}


/* BACK */

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:var(--muted);

    text-decoration:none;

    font-size:9px;
}

.back:hover{
    color:var(--green);
}


@media(max-width:600px){

    .title h1{
        font-size:23px;
    }

    .card{
        padding:17px;
    }

}

</style>
</head>


<body>

<div class="glow green"></div>
<div class="glow blue"></div>


<header>

    <div class="header">

        <div class="logo">

            V2GURD
            <span class="verify">✓</span>

        </div>

        <div class="admin-label">
            ADMIN PANEL
        </div>

    </div>

</header>


<main>


    <section class="title">

        <small>
            V2GURD CONTROL CENTER
        </small>

        <h1>
            مدیریت اطلاعیه‌ها
        </h1>

        <p>
            ساخت و آماده‌سازی پست جدید برای کانال V2GURD
        </p>

    </section>


    <!-- CREATE POST -->

    <section class="card">

        <div class="card-title">
            📢 اطلاعیه جدید
        </div>


        <label>
            عنوان اطلاعیه
        </label>

        <input
            id="postTitle"
            type="text"
            placeholder="مثلاً: بروزرسانی سرورها"
        >


        <label>
            نوع اطلاعیه
        </label>

        <select id="postType">

            <option value="normal">
                📢 اطلاعیه عادی
            </option>

            <option value="important">
                🚨 اطلاعیه مهم
            </option>

            <option value="update">
                🛠️ بروزرسانی
            </option>

            <option value="success">
                🟢 وضعیت پایدار
            </option>

        </select>


        <label>
            متن اطلاعیه
        </label>

        <textarea
            id="postText"
            placeholder="متن اطلاعیه را اینجا بنویس..."
        ></textarea>


        <button onclick="previewPost()">
            نمایش پیش‌نمایش
        </button>

    </section>


    <!-- PREVIEW -->

    <section class="card">

        <div class="card-title">
            👁️ پیش‌نمایش
        </div>


        <div class="preview">

            <div class="preview-header">

                <div class="preview-avatar">
                    V2
                </div>

                <div>

                    <div class="preview-name">
                        V2GURD ✓
                    </div>

                    <div class="preview-date" id="date">
                        همین الان
                    </div>

                </div>

            </div>


            <div
                class="preview-title"
                id="previewTitle"
            >
                عنوان اطلاعیه
            </div>


            <div
                class="preview-text"
                id="previewText"
            >
                متن اطلاعیه اینجا نمایش داده می‌شود.
            </div>


            <div class="status">

                <span class="dot"></span>

                READY TO PUBLISH

            </div>

        </div>

    </section>


    <a
        class="back"
        href="./index.html"
    >
        ← بازگشت به کانال V2GURD
    </a>


</main>


<script>

function previewPost(){

    const title =
        document.getElementById("postTitle").value;

    const text =
        document.getElementById("postText").value;

    const type =
        document.getElementById("postType").value;


    document.getElementById(
        "previewTitle"
    ).textContent =
        title || "عنوان اطلاعیه";


    document.getElementById(
        "previewText"
    ).textContent =
        text || "متن اطلاعیه اینجا نمایش داده می‌شود.";


    const titleElement =
        document.getElementById("previewTitle");


    if(type === "important"){

        titleElement.style.color =
            "#ff4164";

    }else if(type === "update"){

        titleElement.style.color =
            "#2196ff";

    }else{

        titleElement.style.color =
            "#39ff88";

    }


    const now =
        new Date();

    document.getElementById(
        "date"
    ).textContent =
        now.toLocaleString("fa-IR");

}

</script>

</body>
</html>
