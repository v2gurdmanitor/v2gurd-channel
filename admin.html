<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V2GURD Channel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --green:#39ff88;
    --blue:#2196ff;
    --red:#ff4164;
    --bg:#020608;
    --card:rgba(7,18,23,.78);
    --border:rgba(57,255,136,.14);
    --text:#effff6;
    --muted:#71877e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#020608;
    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        linear-gradient(rgba(57,255,136,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(33,150,255,.025) 1px,transparent 1px);

    background-size:45px 45px;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.12;
    z-index:-4;
    pointer-events:none;
}

.glow.green{
    background:var(--green);
    top:-180px;
    right:-150px;
}

.glow.blue{
    background:var(--blue);
    bottom:-180px;
    left:-150px;
}

.glow.red{
    background:var(--red);
    width:250px;
    height:250px;
    top:45%;
    left:45%;
    opacity:.035;
}


/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:20;

    background:rgba(2,7,9,.78);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(25px);
}

.header-inner{
    width:min(700px,calc(100% - 24px));
    margin:auto;

    padding:15px 0;

    display:flex;
    align-items:center;
    gap:13px;
}

.avatar{
    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:19px;
    font-weight:800;

    background:
        radial-gradient(
            circle,
            rgba(57,255,136,.18),
            rgba(2,10,13,.95)
        );

    border:1px solid rgba(57,255,136,.3);

    box-shadow:
        0 0 25px rgba(57,255,136,.1);
}

.channel-info{
    flex:1;
}

.channel-name{
    display:flex;
    align-items:center;
    gap:6px;

    font-size:15px;
    font-weight:800;
}

.verified{
    width:17px;
    height:17px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#168fff;
    color:white;

    font-size:10px;

    box-shadow:
        0 0 12px rgba(22,143,255,.6);
}

.channel-status{
    margin-top:3px;

    color:var(--muted);

    font-size:9px;
}

.online{
    color:var(--green);
}

.telegram-btn{
    text-decoration:none;

    color:white;

    padding:9px 13px;

    border-radius:13px;

    background:rgba(33,150,255,.1);

    border:1px solid rgba(33,150,255,.2);

    font-size:9px;

    transition:.3s;
}

.telegram-btn:hover{
    background:rgba(33,150,255,.2);
    transform:translateY(-2px);
}


/* MAIN */

.container{
    width:min(700px,calc(100% - 24px));
    margin:auto;

    padding:30px 0 70px;
}


/* INTRO */

.channel-card{
    padding:22px;

    margin-bottom:18px;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(8,25,31,.78),
            rgba(3,10,14,.72)
        );

    border:1px solid var(--border);

    backdrop-filter:blur(22px);

    text-align:center;
}

.channel-card h1{
    font-size:22px;
    margin-bottom:8px;
}

.channel-card h1 span{
    color:var(--green);

    text-shadow:
        0 0 20px rgba(57,255,136,.2);
}

.channel-card p{
    color:var(--muted);

    font-size:10px;

    line-height:2;
}

.channel-stats{
    display:flex;

    justify-content:center;

    gap:25px;

    margin-top:16px;

    color:var(--muted);

    font-size:9px;
}

.channel-stats b{
    color:var(--green);
}


/* POSTS */

#posts{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.post{
    padding:19px;

    border-radius:22px;

    background:var(--card);

    border:1px solid rgba(255,255,255,.055);

    backdrop-filter:blur(20px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.18);

    animation:postIn .6s ease both;
}

@keyframes postIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.post-header{
    display:flex;
    align-items:center;
    gap:9px;

    margin-bottom:13px;
}

.post-avatar{
    width:36px;
    height:36px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(57,255,136,.08);

    border:1px solid rgba(57,255,136,.15);

    font-size:13px;
}

.post-author{
    font-size:10px;
    font-weight:700;
}

.post-date{
    display:block;

    color:#53645e;

    font-size:8px;

    margin-top:2px;
}

.post-title{
    font-size:14px;
    font-weight:700;

    margin-bottom:8px;

    color:var(--green);
}

.post-text{
    color:#b4c5be;

    font-size:10px;

    line-height:2;

    white-space:pre-line;
}

.post-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:15px;
    padding-top:11px;

    border-top:1px solid rgba(255,255,255,.04);

    color:#4f625b;

    font-size:8px;
}

.post-tag{
    color:var(--green);
}


/* TYPES */

.post.important{
    border-color:rgba(255,65,100,.2);
}

.post.important .post-title{
    color:var(--red);
}

.post.update{
    border-color:rgba(33,150,255,.18);
}

.post.update .post-title{
    color:var(--blue);
}

.post.success{
    border-color:rgba(57,255,136,.18);
}


/* LOADING */

.loading{
    text-align:center;

    padding:35px;

    color:var(--muted);

    font-size:10px;
}

.loading span{
    color:var(--green);
}


/* FOOTER */

.footer{
    text-align:center;

    padding:30px;

    color:#40514b;

    font-size:8px;
}

.footer b{
    color:#71877e;
}


@media(max-width:600px){

    .telegram-btn{
        font-size:8px;
        padding:8px 10px;
    }

    .channel-name{
        font-size:13px;
    }

    .channel-card h1{
        font-size:19px;
    }
}

</style>
</head>


<body>

<div class="glow green"></div>
<div class="glow blue"></div>
<div class="glow red"></div>


<header class="header">

    <div class="header-inner">

        <div class="avatar">
            V2
        </div>

        <div class="channel-info">

            <div class="channel-name">

                V2GURD

                <span class="verified">
                    ✓
                </span>

            </div>

            <div class="channel-status">

                <span class="online">●</span>
                Official Channel

            </div>

        </div>


        <a
            class="telegram-btn"
            href="https://t.me/v2gurdd"
            target="_blank"
        >
            TELEGRAM ↗
        </a>

    </div>

</header>



<main class="container">


    <section class="channel-card">

        <h1>

            <span>V2GURD</span>
            CHANNEL

        </h1>

        <p>

            کانال رسمی اطلاع‌رسانی V2GURD
            <br>
            اخبار، بروزرسانی سرورها، اختلالات،
            تخفیف‌ها و اطلاعیه‌های مهم

        </p>

        <div class="channel-stats">

            <span>
                STATUS:
                <b>ONLINE</b>
            </span>

            <span>
                NETWORK:
                <b>SECURE</b>
            </span>

        </div>

    </section>


    <div id="posts">

        <div class="loading">
            در حال دریافت اطلاعیه‌ها
            <br>
            <span>V2GURD NETWORK...</span>
        </div>

    </div>


</main>


<footer class="footer">

    <b>V2GURD ✓</b>
    — OFFICIAL INFORMATION CHANNEL

</footer>



<script>

/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
    "https://dymfrorzgmmsbvazsvnb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UXgv11NDv5gIxPdKwMZwZQ_WSQZa2qw";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================
   LOAD POSTS
========================== */

async function loadPosts(){

    const postsContainer =
        document.getElementById("posts");

    const {
        data,
        error
    } = await supabaseClient

        .from("posts")

        .select("*")

        .eq("published", true)

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        postsContainer.innerHTML = `

            <div class="loading">

                ❌ خطا در دریافت اطلاعیه‌ها

                <br>

                <span>
                    V2GURD DATABASE ERROR
                </span>

            </div>

        `;

        return;
    }


    if(!data || data.length === 0){

        postsContainer.innerHTML = `

            <div class="loading">

                هنوز اطلاعیه‌ای منتشر نشده.

                <br>

                <span>
                    V2GURD CHANNEL READY
                </span>

            </div>

        `;

        return;
    }


    postsContainer.innerHTML = "";


    data.forEach(post => {

        const article =
            document.createElement("article");

        article.className =
            "post " + (
                post.type || "normal"
            );


        const date =
            new Date(post.created_at);


        const dateText =
            date.toLocaleString(
                "fa-IR",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            );


        let icon = "📢";

        if(post.type === "important"){
            icon = "🚨";
        }

        if(post.type === "update"){
            icon = "🛠️";
        }

        if(post.type === "success"){
            icon = "🟢";
        }


        article.innerHTML = `

            <div class="post-header">

                <div class="post-avatar">
                    ${icon}
                </div>

                <div>

                    <div class="post-author">
                        V2GURD ✓
                    </div>

                    <span class="post-date">
                        ${dateText}
                    </span>

                </div>

            </div>


            <div class="post-title">
                ${escapeHTML(post.title)}
            </div>


            <div class="post-text">
                ${escapeHTML(post.content)}
            </div>


            <div class="post-footer">

                <span>
                    V2GURD ✓
                </span>

                <span class="post-tag">
                    #${String(post.type || "INFO").toUpperCase()}
                </span>

            </div>

        `;


        postsContainer.appendChild(article);

    });

}


/* ==========================
   SECURITY
========================== */

function escapeHTML(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================
   START
========================== */

loadPosts();


/* هر ۳۰ ثانیه دوباره بررسی می‌کند */

setInterval(
    loadPosts,
    30000
);

</script>

</body>
</html>
