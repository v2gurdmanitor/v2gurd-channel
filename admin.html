<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V2GURD Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --green:#39ff88;
    --blue:#168fff;
    --red:#ff4164;
    --bg:#020608;
    --card:rgba(7,18,23,.86);
    --border:rgba(57,255,136,.15);
    --text:#effff6;
    --muted:#71877e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#020608;
    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;
    background:
        linear-gradient(rgba(57,255,136,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(33,150,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.12;
    z-index:-2;
    pointer-events:none;
}

.green{
    background:#39ff88;
    top:-180px;
    right:-150px;
}

.blue{
    background:#168fff;
    bottom:-180px;
    left:-150px;
}

.container{
    width:min(700px,calc(100% - 20px));
    margin:auto;
    padding:30px 0 60px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px;
    backdrop-filter:blur(20px);
    margin-bottom:16px;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.verify{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#168fff;
    color:#fff;
    font-size:10px;
    box-shadow:0 0 15px rgba(22,143,255,.6);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:18px;
    margin-bottom:24px;
    border-bottom:1px solid var(--border);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--green);
    font-size:9px;
    margin-top:5px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

.login{
    max-width:420px;
    margin:70px auto;
}

.login-logo{
    text-align:center;
    margin-bottom:25px;
}

.login-title{
    text-align:center;
    font-size:23px;
    font-weight:800;
    margin-top:12px;
}

.login-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:9px;
    margin-top:6px;
    margin-bottom:22px;
}

label{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    outline:none;
    color:white;
    background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    padding:13px;
    margin-bottom:15px;
    font-family:inherit;
    font-size:11px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(57,255,136,.45);
    box-shadow:0 0 20px rgba(57,255,136,.07);
}

button{
    font-family:inherit;
}

.primary{
    width:100%;
    border:none;
    border-radius:12px;
    padding:13px;
    background:var(--green);
    color:#001108;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(57,255,136,.2);
}

.primary:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.logout{
    padding:8px 13px;
    border-radius:10px;
    background:rgba(255,65,100,.08);
    border:1px solid rgba(255,65,100,.2);
    color:var(--red);
    cursor:pointer;
    font-size:9px;
}

.admin-title{
    font-size:25px;
    font-weight:800;
}

.admin-subtitle{
    color:var(--muted);
    font-size:9px;
    margin-top:5px;
    margin-bottom:25px;
}

.card-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:18px;
}

.message{
    display:none;
    margin-top:13px;
    padding:11px;
    border-radius:11px;
    font-size:9px;
    line-height:1.9;
    word-break:break-word;
}

.message.show{
    display:block;
}

.message.error{
    color:#ff9bad;
    background:rgba(255,65,100,.07);
    border:1px solid rgba(255,65,100,.15);
}

.message.success{
    color:var(--green);
    background:rgba(57,255,136,.06);
    border:1px solid rgba(57,255,136,.12);
}

.message.info{
    color:#7dbdff;
    background:rgba(33,150,255,.06);
    border:1px solid rgba(33,150,255,.12);
}

.bottom-link{
    display:block;
    text-align:center;
    color:var(--muted);
    text-decoration:none;
    font-size:9px;
    margin-top:18px;
}

.bottom-link:hover{
    color:var(--green);
}

.debug{
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    background:rgba(0,0,0,.25);
    color:#52645e;
    font-size:8px;
    direction:ltr;
    text-align:left;
    display:none;
    word-break:break-all;
}

@media(max-width:600px){
    .container{
        width:calc(100% - 16px);
    }

    .card{
        padding:17px;
    }

    .admin-title{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="glow green"></div>
<div class="glow blue"></div>

<div class="container">

<!-- LOGIN -->
<section id="loginSection" class="login">

    <div class="card">

        <div class="login-logo">
            <div class="logo">
                V2GURD
                <span class="verify">✓</span>
            </div>

            <div class="login-title">
                🔐 ورود مدیریت
            </div>

            <div class="login-subtitle">
                V2GURD CONTROL CENTER
            </div>
        </div>

        <label>ایمیل مدیریت</label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="admin@example.com"
        >

        <label>رمز عبور</label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
        >

        <button
            id="loginButton"
            class="primary"
            onclick="login()"
        >
            ورود به پنل
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</section>


<!-- ADMIN -->
<section id="adminSection" style="display:none;">

    <div class="header">

        <div>

            <div class="logo">
                V2GURD
                <span class="verify">✓</span>
            </div>

            <div class="status">
                <span class="dot"></span>
                ADMIN ONLINE
            </div>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            خروج
        </button>

    </div>


    <div class="admin-title">
        مدیریت اطلاعیه‌ها
    </div>

    <div class="admin-subtitle">
        انتشار مستقیم اطلاعیه برای کانال V2GURD
    </div>


    <div class="card">

        <div class="card-title">
            📢 اطلاعیه جدید
        </div>

        <label>عنوان</label>

        <input
            id="title"
            type="text"
            placeholder="مثلاً: بروزرسانی سرورها"
        >

        <label>نوع اطلاعیه</label>

        <select id="type">

            <option value="normal">
                📢 اطلاعیه عادی
            </option>

            <option value="important">
                🚨 اطلاعیه مهم
            </option>

            <option value="update">
                🛠️ بروزرسانی
            </option>

            <option value="success">
                🟢 وضعیت پایدار
            </option>

        </select>

        <label>متن اطلاعیه</label>

        <textarea
            id="content"
            placeholder="متن اطلاعیه را بنویس..."
        ></textarea>

        <button
            id="publishButton"
            class="primary"
            onclick="publishPost()"
        >
            🚀 انتشار اطلاعیه
        </button>

        <div id="publishMessage" class="message"></div>

        <div id="debugBox" class="debug"></div>

    </div>


    <a
        href="./index.html"
        class="bottom-link"
    >
        ← مشاهده کانال V2GURD
    </a>

</section>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://dymfrorzgmmsbvazsvnb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UXgv11NDv5gIxPdKwMZwZQ_WSQZa2qw";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   MESSAGE
================================ */

function showMessage(
    id,
    text,
    type
){

    const el =
        document.getElementById(id);

    el.textContent = text;

    el.className =
        "message show " + type;
}


/* ================================
   LOGIN
================================ */

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        showMessage(
            "loginMessage",
            "⚠️ ایمیل و رمز عبور را وارد کن.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال ورود...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            throw error;

        }


        if(!data.session){

            throw new Error(
                "Session ایجاد نشد."
            );

        }


        showAdmin();


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            "loginMessage",
            "❌ ورود ناموفق: " +
            error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "ورود به پنل";
}


/* ================================
   SHOW ADMIN
================================ */

function showAdmin(){

    document.getElementById(
        "loginSection"
    ).style.display = "none";

    document.getElementById(
        "adminSection"
    ).style.display = "block";
}


/* ================================
   CHECK SESSION
================================ */

async function checkSession(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .getSession();


        if(error){

            console.error(
                "SESSION ERROR:",
                error
            );

            return;
        }


        if(
            data &&
            data.session
        ){

            showAdmin();

        }

    }catch(error){

        console.error(error);

    }
}


/* ================================
   LOGOUT
================================ */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();
}


/* ================================
   PUBLISH
================================ */

async function publishPost(){

    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const content =
        document.getElementById(
            "content"
        ).value.trim();

    const type =
        document.getElementById(
            "type"
        ).value;

    const button =
        document.getElementById(
            "publishButton"
        );


    if(!title){

        showMessage(
            "publishMessage",
            "⚠️ عنوان را وارد کن.",
            "error"
        );

        return;
    }


    if(!content){

        showMessage(
            "publishMessage",
            "⚠️ متن اطلاعیه را وارد کن.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال انتشار...";


    showMessage(
        "publishMessage",
        "⏳ در حال اتصال به دیتابیس...",
        "info"
    );


    try{

        /* GET SESSION */

        const {
            data:sessionData,
            error:sessionError
        } =
        await supabaseClient.auth
        .getSession();


        if(sessionError){

            throw sessionError;

        }


        if(
            !sessionData ||
            !sessionData.session
        ){

            throw new Error(
                "نشست مدیریت وجود ندارد. دوباره وارد شوید."
            );

        }


        /* INSERT */

        const {
            data,
            error
        } =
        await supabaseClient
        .from("posts")
        .insert({

            title:title,

            content:content,

            type:type,

            published:true

        })
        .select()
        .single();


        console.log(
            "SUPABASE DATA:",
            data
        );

        console.log(
            "SUPABASE ERROR:",
            error
        );


        if(error){

            throw error;

        }


        /* SUCCESS */

        showMessage(
            "publishMessage",
            "✅ پست واقعاً داخل دیتابیس ثبت شد.",
            "success"
        );


        document.getElementById(
            "title"
        ).value = "";

        document.getElementById(
            "content"
        ).value = "";


        document.getElementById(
            "debugBox"
        ).style.display = "block";

        document.getElementById(
            "debugBox"
        ).textContent =
            "POST ID: " +
            data.id +
            " | CREATED: " +
            data.created_at;


    }catch(error){

        console.error(
            "PUBLISH ERROR:",
            error
        );


        document.getElementById(
            "debugBox"
        ).style.display = "block";

        document.getElementById(
            "debugBox"
        ).textContent =
            JSON.stringify(
                error,
                null,
                2
            );


        showMessage(
            "publishMessage",
            "❌ انتشار ناموفق: " +
            (
                error.message ||
                "خطای ناشناخته"
            ),
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "🚀 انتشار اطلاعیه";
}


/* ================================
   START
================================ */

checkSession();

</script>

</body>
</html>
