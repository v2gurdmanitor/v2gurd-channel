<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>V2GURD Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#020608;
    --card:rgba(8,18,23,.9);
    --green:#39ff88;
    --blue:#168fff;
    --red:#ff4164;
    --yellow:#ffd45c;
    --text:#effff6;
    --muted:#71877e;
    --border:rgba(57,255,136,.13);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,rgba(57,255,136,.06),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(22,143,255,.06),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
}

.container{
    width:min(760px,calc(100% - 18px));
    margin:auto;
    padding:25px 0 60px;
}

.glow{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.08;
    pointer-events:none;
    z-index:-1;
}

.g1{
    background:var(--green);
    top:-150px;
    right:-150px;
}

.g2{
    background:var(--blue);
    bottom:-150px;
    left:-150px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    backdrop-filter:blur(18px);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:18px;
    margin-bottom:22px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
    font-size:20px;
    font-weight:800;
}

.verify{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#168fff;
    color:#fff;
    font-size:10px;
    box-shadow:0 0 13px rgba(22,143,255,.45);
}

.status{
    color:var(--green);
    font-size:8px;
    margin-top:4px;
}

.dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
    margin-left:4px;
}

h1{
    font-size:23px;
    margin-bottom:5px;
}

.subtitle{
    color:var(--muted);
    font-size:9px;
    margin-bottom:23px;
}

.card-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:17px;
}

label{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.07);
    color:#fff;
    border-radius:11px;
    outline:none;
    padding:12px;
    margin-bottom:14px;
    font-family:inherit;
    font-size:10px;
}

textarea{
    min-height:135px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(57,255,136,.35);
}

button{
    font-family:inherit;
    cursor:pointer;
}

.primary{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:var(--green);
    color:#001108;
    font-weight:800;
    font-size:10px;
}

.primary:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:11px;
    border-radius:10px;
    margin-top:12px;
    font-size:9px;
    line-height:1.8;
}

.message.show{
    display:block;
}

.message.success{
    color:var(--green);
    background:rgba(57,255,136,.06);
    border:1px solid rgba(57,255,136,.13);
}

.message.error{
    color:#ff9bad;
    background:rgba(255,65,100,.06);
    border:1px solid rgba(255,65,100,.13);
}

.message.info{
    color:#79b9ff;
    background:rgba(22,143,255,.06);
    border:1px solid rgba(22,143,255,.13);
}

.logout{
    border:1px solid rgba(255,65,100,.18);
    background:rgba(255,65,100,.06);
    color:var(--red);
    padding:8px 12px;
    border-radius:9px;
    font-size:8px;
}


/* POSTS */

.posts-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.refresh{
    border:1px solid rgba(57,255,136,.15);
    background:rgba(57,255,136,.05);
    color:var(--green);
    padding:7px 10px;
    border-radius:8px;
    font-size:8px;
}

.post{
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
}

.post.hidden{
    opacity:.48;
    border-color:rgba(255,212,92,.15);
}

.post-top{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.post-info{
    flex:1;
}

.post-title{
    font-size:11px;
    font-weight:800;
    margin-bottom:4px;
}

.post-date{
    color:var(--muted);
    font-size:8px;
}

.post-content{
    color:#b9c8c3;
    font-size:9px;
    line-height:1.9;
    margin-top:10px;
    white-space:pre-wrap;
    word-break:break-word;
}

.badge{
    display:inline-block;
    padding:4px 7px;
    border-radius:7px;
    font-size:7px;
    margin-top:8px;
}

.badge-visible{
    color:var(--green);
    background:rgba(57,255,136,.07);
}

.badge-hidden{
    color:var(--yellow);
    background:rgba(255,212,92,.07);
}

.actions{
    display:flex;
    gap:7px;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.05);
}

.action{
    flex:1;
    border-radius:8px;
    padding:9px 5px;
    font-size:8px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.025);
    color:#c7d2ce;
}

.action.hide{
    color:var(--yellow);
    border-color:rgba(255,212,92,.12);
}

.action.show{
    color:var(--green);
    border-color:rgba(57,255,136,.12);
}

.action.delete{
    color:var(--red);
    border-color:rgba(255,65,100,.12);
}

.empty{
    text-align:center;
    color:var(--muted);
    font-size:9px;
    padding:35px 10px;
}

.login{
    max-width:420px;
    margin:70px auto;
}

.login-title{
    text-align:center;
    font-size:24px;
    font-weight:800;
    margin-bottom:5px;
}

.login-sub{
    text-align:center;
    color:var(--muted);
    font-size:8px;
    margin-bottom:22px;
}

@media(max-width:600px){

    .container{
        width:calc(100% - 12px);
    }

    .card{
        padding:16px;
    }

    .actions{
        gap:5px;
    }

    .action{
        font-size:7px;
    }

}
</style>
</head>

<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="container">

<!-- LOGIN -->

<section id="loginSection" class="login">

    <div class="card">

        <div style="text-align:center;margin-bottom:20px;">

            <div class="brand">
                V2GURD
                <span class="verify">✓</span>
            </div>

            <div class="login-title">
                🔐 مدیریت کانال
            </div>

            <div class="login-sub">
                V2GURD CONTROL CENTER
            </div>

        </div>

        <label>ایمیل</label>

        <input
            id="email"
            type="email"
            placeholder="admin@example.com"
        >

        <label>رمز عبور</label>

        <input
            id="password"
            type="password"
            placeholder="••••••••"
        >

        <button
            id="loginButton"
            class="primary"
            onclick="login()"
        >
            ورود
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</section>


<!-- ADMIN -->

<section id="adminSection" style="display:none;">

    <div class="header">

        <div>

            <div class="brand">
                V2GURD
                <span class="verify">✓</span>
            </div>

            <div class="status">
                <span class="dot"></span>
                ADMIN ONLINE
            </div>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            خروج
        </button>

    </div>


    <h1>
        مدیریت کانال
    </h1>

    <div class="subtitle">
        انتشار و مدیریت اطلاعیه‌های V2GURD
    </div>


    <!-- NEW POST -->

    <div class="card">

        <div class="card-title">
            📢 انتشار اطلاعیه جدید
        </div>

        <label>عنوان</label>

        <input
            id="title"
            type="text"
            placeholder="عنوان اطلاعیه..."
        >

        <label>نوع اطلاعیه</label>

        <select id="type">

            <option value="normal">
                📢 اطلاعیه عادی
            </option>

            <option value="important">
                🚨 اطلاعیه مهم
            </option>

            <option value="update">
                🛠️ بروزرسانی
            </option>

            <option value="success">
                🟢 وضعیت پایدار
            </option>

        </select>

        <label>متن</label>

        <textarea
            id="content"
            placeholder="متن اطلاعیه..."
        ></textarea>

        <button
            id="publishButton"
            class="primary"
            onclick="publishPost()"
        >
            🚀 انتشار اطلاعیه
        </button>

        <div id="publishMessage" class="message"></div>

    </div>


    <!-- POSTS -->

    <div class="card">

        <div class="posts-header">

            <div class="card-title" style="margin:0;">
                📋 اطلاعیه‌ها
            </div>

            <button
                class="refresh"
                onclick="loadPosts()"
            >
                ↻ بروزرسانی
            </button>

        </div>

        <div id="postsList">

            <div class="empty">
                در حال دریافت اطلاعیه‌ها...
            </div>

        </div>

    </div>

</section>

</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://dymfrorzgmmsbvazsvnb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UXgv11NDv5gIxPdKwMZwZQ_WSQZa2qw";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   HELPERS
================================= */

function showMessage(id,text,type){

    const el =
        document.getElementById(id);

    el.textContent = text;

    el.className =
        "message show " + type;
}


function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatDate(date){

    const d =
        new Date(date);

    return new Intl.DateTimeFormat(
        "fa-IR",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(d);
}


/* =================================
   LOGIN
================================= */

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        showMessage(
            "loginMessage",
            "⚠️ ایمیل و رمز عبور را وارد کن.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال ورود...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email,
            password

        });


        if(error)
            throw error;


        if(!data.session)
            throw new Error(
                "نشست مدیریت ایجاد نشد."
            );


        document.getElementById(
            "loginSection"
        ).style.display = "none";


        document.getElementById(
            "adminSection"
        ).style.display = "block";


        await loadPosts();


    }catch(error){

        showMessage(
            "loginMessage",
            "❌ " + error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "ورود";
}


/* =================================
   SESSION
================================= */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth
    .getSession();


    if(
        data &&
        data.session
    ){

        document.getElementById(
            "loginSection"
        ).style.display = "none";


        document.getElementById(
            "adminSection"
        ).style.display = "block";


        loadPosts();

    }
}


/* =================================
   LOGOUT
================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();
}


/* =================================
   PUBLISH
================================= */

async function publishPost(){

    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const content =
        document.getElementById(
            "content"
        ).value.trim();

    const type =
        document.getElementById(
            "type"
        ).value;

    const button =
        document.getElementById(
            "publishButton"
        );


    if(!title){

        showMessage(
            "publishMessage",
            "⚠️ عنوان را وارد کن.",
            "error"
        );

        return;
    }


    if(!content){

        showMessage(
            "publishMessage",
            "⚠️ متن را وارد کن.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال انتشار...";


    try{

        const {
            data:sessionData
        } =
        await supabaseClient.auth
        .getSession();


        if(
            !sessionData ||
            !sessionData.session
        ){

            throw new Error(
                "نشست مدیریت منقضی شده است."
            );

        }


        const {
            data,
            error
        } =
        await supabaseClient
        .from("posts")
        .insert({

            title:title,
            content:content,
            type:type,
            published:true

        })
        .select()
        .single();


        if(error)
            throw error;


        showMessage(
            "publishMessage",
            "✅ اطلاعیه منتشر شد.",
            "success"
        );


        document.getElementById(
            "title"
        ).value = "";


        document.getElementById(
            "content"
        ).value = "";


        await loadPosts();


    }catch(error){

        console.error(error);

        showMessage(
            "publishMessage",
            "❌ " + error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "🚀 انتشار اطلاعیه";
}


/* =================================
   LOAD POSTS
================================= */

async function loadPosts(){

    const list =
        document.getElementById(
            "postsList"
        );


    list.innerHTML = `
        <div class="empty">
            ⏳ در حال دریافت...
        </div>
    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("posts")

        .select(
            "id,title,content,type,created_at,published"
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error)
            throw error;


        renderPosts(
            data || []
        );


    }catch(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty" style="color:#ff8095;">
                ❌ ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =================================
   RENDER POSTS
================================= */

function renderPosts(posts){

    const list =
        document.getElementById(
            "postsList"
        );


    if(!posts.length){

        list.innerHTML = `
            <div class="empty">
                📭 هنوز اطلاعیه‌ای وجود ندارد.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    posts.forEach(post => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "post " +
            (
                post.published
                ? ""
                : "hidden"
            );


        const status =
            post.published

            ? `
                <span class="badge badge-visible">
                    ● در سایت نمایش داده می‌شود
                </span>
              `

            : `
                <span class="badge badge-hidden">
                    ● مخفی از سایت
                </span>
              `;


        const toggleButton =
            post.published

            ? `
                <button
                    class="action hide"
                    onclick="togglePost(${post.id},false)"
                >
                    👁 مخفی کردن
                </button>
              `

            : `
                <button
                    class="action show"
                    onclick="togglePost(${post.id},true)"
                >
                    👁 نمایش دوباره
                </button>
              `;


        item.innerHTML = `

            <div class="post-top">

                <div class="post-info">

                    <div class="post-title">
                        ${escapeHTML(post.title)}
                    </div>

                    <div class="post-date">
                        ${formatDate(post.created_at)}
                    </div>

                </div>

            </div>

            ${status}

            <div class="post-content">
                ${escapeHTML(post.content)}
            </div>

            <div class="actions">

                ${toggleButton}

                <button
                    class="action delete"
                    onclick="deletePost(${post.id})"
                >
                    🗑 حذف دائمی
                </button>

            </div>
        `;


        list.appendChild(item);

    });

}


/* =================================
   HIDE / SHOW
================================= */

async function togglePost(
    id,
    published
){

    try{

        const {
            error
        } =
        await supabaseClient

        .from("posts")

        .update({
            published:published
        })

        .eq(
            "id",
            id
        );


        if(error)
            throw error;


        await loadPosts();


    }catch(error){

        alert(
            "خطا: " +
            error.message
        );

    }

}


/* =================================
   DELETE
================================= */

async function deletePost(id){

    const confirmed =
        confirm(
            "⚠️ این اطلاعیه برای همیشه حذف می‌شود.\n\nمطمئنی؟"
        );


    if(!confirmed)
        return;


    try{

        const {
            error
        } =
        await supabaseClient

        .from("posts")

        .delete()

        .eq(
            "id",
            id
        );


        if(error)
            throw error;


        await loadPosts();


    }catch(error){

        alert(
            "❌ حذف انجام نشد:\n" +
            error.message
        );

    }

}


/* =================================
   REALTIME
================================= */

supabaseClient

.channel(
    "admin-posts"
)

.on(

    "postgres_changes",

    {
        event:"*",
        schema:"public",
        table:"posts"
    },

    () => {

        loadPosts();

    }

)

.subscribe();


/* =================================
   START
================================= */

checkSession();

</script>

</body>
</html>
