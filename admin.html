<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>V2GURD Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --green:#39ff88;
    --blue:#2196ff;
    --red:#ff4164;
    --bg:#020608;
    --card:rgba(7,18,23,.82);
    --border:rgba(57,255,136,.14);
    --text:#effff6;
    --muted:#71877e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        linear-gradient(
            rgba(57,255,136,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(33,150,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.12;
    z-index:-4;
}

.green{
    background:var(--green);
    top:-180px;
    right:-150px;
}

.blue{
    background:var(--blue);
    bottom:-180px;
    left:-150px;
}

.container{
    width:min(700px,calc(100% - 24px));
    margin:auto;
    padding:35px 0 60px;
}


/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding-bottom:20px;
    margin-bottom:20px;

    border-bottom:1px solid var(--border);
}

.logo{
    font-size:20px;
    font-weight:800;
}

.verify{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#168fff;
    color:white;

    font-size:10px;

    box-shadow:0 0 14px rgba(22,143,255,.55);
}

.logout{
    width:auto;

    padding:8px 13px;

    border-radius:10px;

    background:rgba(255,65,100,.08);

    border:1px solid rgba(255,65,100,.2);

    color:var(--red);

    cursor:pointer;

    font-family:inherit;
    font-size:9px;
}


/* LOGIN */

.login{
    max-width:420px;
    margin:80px auto;
}

.login h1{
    text-align:center;
    margin-bottom:8px;
}

.login p{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    margin-bottom:22px;
}

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

    backdrop-filter:blur(20px);

    margin-bottom:16px;
}

label{
    display:block;

    color:var(--muted);

    font-size:9px;

    margin-bottom:7px;
}

input,
textarea,
select{

    width:100%;

    outline:none;

    border:none;

    color:white;

    background:rgba(0,0,0,.3);

    border:1px solid rgba(255,255,255,.06);

    border-radius:12px;

    padding:13px;

    margin-bottom:15px;

    font-family:inherit;
    font-size:11px;

}

textarea{
    min-height:150px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{

    border-color:rgba(57,255,136,.35);

    box-shadow:
        0 0 20px rgba(57,255,136,.05);

}

button.primary{

    width:100%;

    border:none;

    border-radius:12px;

    padding:13px;

    background:var(--green);

    color:#001108;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

}

button.primary:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(57,255,136,.2);

}

.message{

    margin-top:12px;

    text-align:center;

    font-size:9px;

    color:var(--red);
}


/* ADMIN */

.admin h1{
    font-size:25px;
}

.subtitle{
    color:var(--muted);
    font-size:9px;
    margin-top:5px;
    margin-bottom:25px;
}

.card-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:17px;
}

.success{
    color:var(--green);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    margin-top:10px;

    color:var(--green);

    font-size:9px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 12px var(--green);
}

</style>

</head>


<body>

<div class="glow green"></div>
<div class="glow blue"></div>


<div class="container">


<!-- LOGIN -->

<section
id="loginSection"
class="login"
>

<div class="header">

<div class="logo">
V2GURD
<span class="verify">✓</span>
</div>

</div>


<div class="card">

<h1>
🔐 ورود مدیریت
</h1>

<p>
V2GURD CONTROL CENTER
</p>


<label>
ایمیل
</label>

<input
id="email"
type="email"
placeholder="admin@example.com"
>


<label>
رمز عبور
</label>

<input
id="password"
type="password"
placeholder="••••••••"
>


<button
class="primary"
onclick="login()"
>
ورود به پنل
</button>


<div
id="loginMessage"
class="message"
></div>

</div>

</section>



<!-- ADMIN PANEL -->

<section
id="adminSection"
class="admin"
style="display:none;"
>


<div class="header">

<div>

<div class="logo">
V2GURD
<span class="verify">✓</span>
</div>

<div class="status">
<span class="dot"></span>
ADMIN ONLINE
</div>

</div>


<button
class="logout"
onclick="logout()"
>
خروج
</button>

</div>


<h1>
مدیریت اطلاعیه‌ها
</h1>

<div class="subtitle">
انتشار مستقیم اطلاعیه برای کاربران V2GURD
</div>


<div class="card">

<div class="card-title">
📢 انتشار اطلاعیه جدید
</div>


<label>
عنوان
</label>

<input
id="title"
type="text"
placeholder="مثلاً: بروزرسانی سرورها"
>


<label>
نوع اطلاعیه
</label>

<select id="type">

<option value="normal">
📢 اطلاعیه عادی
</option>

<option value="important">
🚨 اطلاعیه مهم
</option>

<option value="update">
🛠️ بروزرسانی
</option>

<option value="success">
🟢 وضعیت پایدار
</option>

</select>


<label>
متن
</label>

<textarea
id="content"
placeholder="متن اطلاعیه را بنویس..."
></textarea>


<button
class="primary"
onclick="publishPost()"
>
🚀 انتشار اطلاعیه
</button>


<div
id="publishMessage"
class="message"
></div>

</div>


<a
href="./index.html"
style="
display:block;
text-align:center;
color:#71877e;
font-size:9px;
text-decoration:none;
"
>
← مشاهده کانال
</a>


</section>


</div>



<script>


/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
"https://dymfrorzgmmsbvazsvnb.supabase.co";


const SUPABASE_KEY =
"sb_publishable_UXgv11NDv5gIxPdKwMZwZQ_WSQZa2qw";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================
   LOGIN
========================== */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const message =
        document.getElementById("loginMessage");


    message.textContent =
        "در حال ورود...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

    });


    if(error){

        message.textContent =
            "❌ ایمیل یا رمز عبور اشتباه است.";

        return;
    }


    showAdmin();

}


/* ==========================
   SHOW ADMIN
========================== */

function showAdmin(){

    document.getElementById(
        "loginSection"
    ).style.display="none";


    document.getElementById(
        "adminSection"
    ).style.display="block";

}


/* ==========================
   CHECK SESSION
========================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(data.session){

        showAdmin();

    }

}


/* ==========================
   LOGOUT
========================== */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* ==========================
   PUBLISH
========================== */

async function publishPost(){

    const title =
        document.getElementById("title").value.trim();

    const content =
        document.getElementById("content").value.trim();

    const type =
        document.getElementById("type").value;


    const message =
        document.getElementById("publishMessage");


    if(!title || !content){

        message.textContent =
            "⚠️ عنوان و متن را وارد کن.";

        return;
    }


    message.textContent =
        "در حال انتشار...";


    const {
        error
    } =
    await supabaseClient

        .from("posts")

        .insert({

            title:title,

            content:content,

            type:type,

            published:true

        });


    if(error){

        console.error(error);

        message.textContent =
            "❌ انتشار انجام نشد.";

        return;
    }


    message.textContent =
        "✅ اطلاعیه با موفقیت منتشر شد.";


    document.getElementById(
        "title"
    ).value="";


    document.getElementById(
        "content"
    ).value="";

}


/* ==========================
   START
========================== */

checkSession();


</script>

</body>

</html>
