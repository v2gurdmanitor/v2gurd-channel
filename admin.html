<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V2GURD Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --green:#39ff88;
    --blue:#2196ff;
    --red:#ff4164;
    --yellow:#ffd166;
    --bg:#020608;
    --card:rgba(7,18,23,.84);
    --border:rgba(57,255,136,.14);
    --text:#effff6;
    --muted:#71877e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:"Vazirmatn",sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        linear-gradient(
            rgba(57,255,136,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(33,150,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.12;
    z-index:-4;
    pointer-events:none;
}

.green{
    background:var(--green);
    top:-180px;
    right:-150px;
}

.blue{
    background:var(--blue);
    bottom:-180px;
    left:-150px;
}

.container{
    width:min(700px,calc(100% - 24px));
    margin:auto;
    padding:30px 0 60px;
}


/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding-bottom:18px;
    margin-bottom:22px;

    border-bottom:1px solid var(--border);
}

.logo{
    font-size:20px;
    font-weight:800;
}

.verify{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#168fff;
    color:white;

    font-size:10px;

    box-shadow:
        0 0 14px rgba(22,143,255,.55);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    color:var(--green);

    font-size:9px;
    margin-top:4px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px var(--green);
}


/* CARD */

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

    backdrop-filter:blur(20px);

    margin-bottom:16px;
}

.card-title{
    font-size:13px;
    font-weight:700;

    margin-bottom:18px;
}


/* LOGIN */

.login{
    max-width:420px;
    margin:70px auto;
}

.login-title{
    text-align:center;
    font-size:24px;
    font-weight:800;
}

.login-subtitle{
    text-align:center;

    color:var(--muted);

    font-size:9px;

    margin-top:7px;
    margin-bottom:22px;
}


/* INPUTS */

label{
    display:block;

    color:var(--muted);

    font-size:9px;

    margin-bottom:7px;
}

input,
textarea,
select{

    width:100%;

    outline:none;
    border:none;

    color:white;

    background:rgba(0,0,0,.3);

    border:1px solid rgba(255,255,255,.06);

    border-radius:12px;

    padding:13px;

    margin-bottom:15px;

    font-family:inherit;
    font-size:11px;

    transition:.2s;
}

textarea{
    min-height:150px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{

    border-color:
        rgba(57,255,136,.4);

    box-shadow:
        0 0 20px
        rgba(57,255,136,.06);
}


/* BUTTON */

button{
    font-family:inherit;
}

.primary{

    width:100%;

    border:none;

    border-radius:12px;

    padding:13px;

    background:var(--green);

    color:#001108;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;
}

.primary:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(57,255,136,.2);
}

.primary:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;
}


/* LOGOUT */

.logout{

    width:auto;

    padding:8px 13px;

    border-radius:10px;

    background:
        rgba(255,65,100,.08);

    border:
        1px solid
        rgba(255,65,100,.2);

    color:var(--red);

    cursor:pointer;

    font-size:9px;
}


/* MESSAGES */

.message{

    margin-top:13px;

    padding:11px;

    border-radius:11px;

    font-size:9px;

    line-height:1.8;

    display:none;

    word-break:break-word;
}

.message.show{
    display:block;
}

.message.error{

    color:#ff8da4;

    background:
        rgba(255,65,100,.07);

    border:
        1px solid
        rgba(255,65,100,.15);
}

.message.success{

    color:var(--green);

    background:
        rgba(57,255,136,.06);

    border:
        1px solid
        rgba(57,255,136,.12);
}

.message.info{

    color:#7dbdff;

    background:
        rgba(33,150,255,.06);

    border:
        1px solid
        rgba(33,150,255,.12);
}


/* ADMIN */

.admin-title{
    font-size:25px;
    font-weight:800;
}

.admin-subtitle{

    color:var(--muted);

    font-size:9px;

    margin-top:5px;
    margin-bottom:25px;
}


/* LINKS */

.bottom-link{

    display:block;

    text-align:center;

    color:var(--muted);

    text-decoration:none;

    font-size:9px;

    margin-top:18px;
}

.bottom-link:hover{
    color:var(--green);
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:calc(100% - 18px);
    }

    .card{
        padding:17px;
    }

    .admin-title{
        font-size:22px;
    }

}

</style>

</head>


<body>

<div class="glow green"></div>
<div class="glow blue"></div>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<section
id="loginSection"
class="login"
>

<div class="card">

<div class="logo" style="text-align:center;">
    V2GURD
    <span class="verify">✓</span>
</div>

<div class="login-title">
    🔐 ورود مدیریت
</div>

<div class="login-subtitle">
    V2GURD CONTROL CENTER
</div>


<label>
ایمیل مدیریت
</label>

<input
id="email"
type="email"
autocomplete="email"
placeholder="admin@example.com"
>


<label>
رمز عبور
</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="••••••••"
>


<button
id="loginButton"
class="primary"
onclick="login()"
>
ورود به پنل
</button>


<div
id="loginMessage"
class="message"
></div>

</div>

</section>



<!-- =========================
     ADMIN
========================= -->

<section
id="adminSection"
style="display:none;"
>


<div class="header">

<div>

<div class="logo">

V2GURD
<span class="verify">✓</span>

</div>

<div class="status">

<span class="dot"></span>

ADMIN ONLINE

</div>

</div>


<button
class="logout"
onclick="logout()"
>
خروج
</button>

</div>


<div class="admin-title">
مدیریت اطلاعیه‌ها
</div>

<div class="admin-subtitle">
انتشار مستقیم اطلاعیه برای کانال V2GURD
</div>


<!-- CREATE POST -->

<div class="card">

<div class="card-title">
📢 اطلاعیه جدید
</div>


<label>
عنوان
</label>

<input
id="title"
type="text"
placeholder="مثلاً: بروزرسانی سرورها"
>


<label>
نوع اطلاعیه
</label>

<select id="type">

<option value="normal">
📢 اطلاعیه عادی
</option>

<option value="important">
🚨 اطلاعیه مهم
</option>

<option value="update">
🛠️ بروزرسانی
</option>

<option value="success">
🟢 وضعیت پایدار
</option>

</select>


<label>
متن اطلاعیه
</label>

<textarea
id="content"
placeholder="متن اطلاعیه را بنویس..."
></textarea>


<button
id="publishButton"
class="primary"
onclick="publishPost()"
>
🚀 انتشار اطلاعیه
</button>


<div
id="publishMessage"
class="message"
></div>

</div>


<a
href="./index.html"
class="bottom-link"
>
← مشاهده کانال V2GURD
</a>

</section>

</div>



<script>

/* =================================
   SUPABASE CONFIG
================================= */

const SUPABASE_URL =
"https://dymfrorzgmmsbvazsvnb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UXgv11NDv5gIxPdKwMZwZQ_WSQZa2qw";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   MESSAGE HELPER
================================= */

function showMessage(
    elementId,
    text,
    type
){

    const element =
        document.getElementById(elementId);

    element.textContent = text;

    element.className =
        "message show " + type;

}


/* =================================
   LOGIN
================================= */

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        showMessage(
            "loginMessage",
            "⚠️ ایمیل و رمز عبور را وارد کن.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال ورود...";


    const {
        data,
        error
    } =
    await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    button.disabled = false;

    button.textContent =
        "ورود به پنل";


    if(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            "loginMessage",
            "❌ ورود ناموفق: " +
            error.message,
            "error"
        );

        return;
    }


    if(data && data.session){

        showAdmin();

    }else{

        showMessage(
            "loginMessage",
            "❌ Session ایجاد نشد.",
            "error"
        );

    }

}


/* =================================
   SHOW ADMIN
================================= */

function showAdmin(){

    document.getElementById(
        "loginSection"
    ).style.display = "none";


    document.getElementById(
        "adminSection"
    ).style.display = "block";

}


/* =================================
   CHECK SESSION
================================= */

async function checkSession(){

    const {
        data,
        error
    } =
    await supabaseClient.auth
        .getSession();


    if(error){

        console.error(
            "SESSION ERROR:",
            error
        );

        return;
    }


    if(data && data.session){

        showAdmin();

    }

}


/* =================================
   LOGOUT
================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =================================
   PUBLISH POST
================================= */

async function publishPost(){

    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const content =
        document.getElementById(
            "content"
        ).value.trim();

    const type =
        document.getElementById(
            "type"
        ).value;


    const button =
        document.getElementById(
            "publishButton"
        );


    if(!title){

        showMessage(
            "publishMessage",
            "⚠️ عنوان را وارد کن.",
            "error"
        );

        return;
    }


    if(!content){

        showMessage(
            "publishMessage",
            "⚠️ متن اطلاعیه را وارد کن.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "در حال انتشار...";


    showMessage(
        "publishMessage",
        "⏳ در حال ارسال به دیتابیس...",
        "info"
    );


    try{

        /* -------------------------
           CHECK SESSION
        ------------------------- */

        const {
            data:sessionData,
            error:sessionError
        } =
        await supabaseClient.auth
            .getSession();


        if(sessionError){

            throw sessionError;

        }


        if(
            !sessionData ||
            !sessionData.session
        ){

            throw new Error(
                "نشست مدیریت معتبر نیست. دوباره وارد شوید."
            );

        }


        /* -------------------------
           INSERT
        ------------------------- */

        const {
            data,
            error
        } =
        await supabaseClient

            .from("posts")

            .insert({

                title:title,

                content:content,

                type:type,

                published:true

            })

            .select();


        if(error){

            console.error(
                "SUPABASE INSERT ERROR:",
                error
            );

            throw error;

        }


        /* -------------------------
           SUCCESS
        ------------------------- */

        console.log(
            "POST CREATED:",
            data
        );


        showMessage(
            "publishMessage",
            "✅ اطلاعیه با موفقیت منتشر شد.",
            "success"
        );


        document.getElementById(
            "title"
        ).value = "";


        document.getElementById(
            "content"
        ).value = "";


    }catch(error){

        console.error(
            "PUBLISH ERROR:",
            error
        );


        let errorText =
            error.message ||
            "خطای ناشناخته";


        if(error.code){

            errorText +=
                " | Code: " +
                error.code;

        }


        showMessage(
            "publishMessage",
            "❌ انتشار ناموفق: " +
            errorText,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "🚀 انتشار اطلاعیه";

}


/* =================================
   START
================================= */

checkSession();

</script>

</body>

</html>
